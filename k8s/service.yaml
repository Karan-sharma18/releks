apiVersion: v1
kind: Service
metadata:
  name: releks-frontend
  labels:
    app: releks-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: releks-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
