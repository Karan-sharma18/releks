
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releks-frontend
  labels:
    app: releks-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: releks-frontend
  template:
    metadata:
      labels:
        app: releks-frontend
    spec:
      containers:
        - name: frontend
          image: 596319332793.dkr.ecr.us-east-1.amazonaws.com/relicstaurants-frontend:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
