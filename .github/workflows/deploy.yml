name: Build and Deploy Relicstaurants Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: relicstaurants-frontend
  EKS_CLUSTER_NAME: releks-cluster
  K8S_NAMESPACE: default
  DEPLOYMENT_NAME: releks-frontend
  CONTAINER_NAME: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::596319332793:role/GitHubActions-Relicstaurants-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/relicstaurants-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/relicstaurants-frontend:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Update frontend Deployment
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/relicstaurants-frontend:${GITHUB_SHA}"

          kubectl set image \
            deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME"="$IMAGE" \
            --namespace "$K8S_NAMESPACE"

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/"$DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE"

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -l app=releks-frontend

          kubectl get service releks-frontend \
            --namespace "$K8S_NAMESPACE"